schema_version: "1.1"
name: deepen-bypass-run-tests
description: >
  Explicit /deepen on a short command must bypass: one bypass line, no Ambition Rewrite. Bash is not granted, so the action is graded on the reply staying at running the tests.
tags: [deepen, skill-trigger]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill]

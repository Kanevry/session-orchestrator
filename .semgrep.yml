# RE-SCOPED 2026-08-28 (#1129). The two rules below were absent from this file
# not because they are inapplicable, but because the baseline copy carries
# `paths: include: - "**/src/"` and this repo has no `src/` directory. A path
# filter pointing at a directory that does not exist is not an exclusion — it is
# an accident that looks like one. The baseline patterns themselves are also
# wrong here: both pin their untrusted source to `req.body`/`req.query`/
# `req.params`, and this repo has no HTTP request path (0 matches, measured
# 2026-08-28 @ 4950990). So the filter was re-pointed AND the patterns were
# rewritten around THIS repo's actual trust boundary: the output of a child
# process, hook stdin, and fetch response bodies.
#
# Both are taint-mode: the dominant shape here is `const raw = <untrusted>;`
# followed by `JSON.parse(raw)` two lines down, which no syntactic pattern
# reaches. Named ceiling (BV-004): the source list is enumerated, not
# exhaustive — chunk-accumulated `process.stdin.on('data')` reads are NOT a
# source, because the accumulator shape (`chunks.join('')`) is indistinguishable
# from any other join. Revisit trigger: a hook parses stdin via chunk
# accumulation WITHOUT a try/catch and it escapes to production.
#
# prototype-pollution-object-assign carries ONLY the Object.assign sink. An
# object-spread sink was written, measured, and DROPPED — with evidence, not by
# path filter, which is the whole point of #1129:
#   - 22 of 22 findings it produced came from spreads; zero from Object.assign.
#   - Object spread has no true-positive capacity for CWE-1321. Spread copies own
#     enumerable properties, so a `__proto__` key from JSON.parse becomes an own
#     data property and the prototype chain is untouched. Object.assign copies
#     with [[Set]] semantics, which invokes the Object.prototype `__proto__`
#     setter and DOES replace the target's prototype. Measured 2026-08-28:
#       {...JSON.parse('{"__proto__":{"polluted":true}}')}      -> proto changed? false
#       Object.assign({}, JSON.parse('{"__proto__":{...}}'))    -> proto changed? true, .polluted true
#   A sink with zero true-positive capacity and 22 false positives is the exact
#   HR-101 shape this file already refuses ("a signal may only warn if it is rare").
- id: json-parse-untrusted-input
  mode: taint
  pattern-sources:
  - pattern: $X.stdout
  - pattern: readFileSync(0, ...)
  - pattern: await $R.text(...)
  pattern-sinks:
  - patterns:
    - pattern: JSON.parse($SINK, ...)
    - pattern-not-inside: try { ... } catch($E) { ... }
    - pattern-not-inside: $SCHEMA.parse(JSON.parse(...), ...)
    - pattern-not-inside: $SCHEMA.safeParse(JSON.parse(...), ...)
  message: 'JSON.parse() on untrusted input with no guard (CWE-502). Subagent, hook and CLI output is
    untrusted input: a child process that dies, prints a warning banner, or returns an empty stdout makes
    this throw, and an unguarded throw at a hook/CLI boundary takes the whole invocation down. Wrap the
    parse in try/catch, or validate the result with a schema — `schema.parse(JSON.parse(input))`.'
  languages:
  - typescript
  - javascript
  severity: WARNING
  metadata:
    category: security
    cwe: 'CWE-502: Deserialization of Untrusted Data'
    owasp: A08:2021
    confidence: MEDIUM
- id: prototype-pollution-object-assign
  mode: taint
  pattern-sources:
  - pattern: JSON.parse(...)
  pattern-sinks:
  - pattern: Object.assign($TARGET, $SINK, ...)
  message: 'Prototype pollution risk: a JSON.parse() result is merged into an existing object via Object.assign
    (CWE-1321). Object.assign copies with [[Set]] semantics, so a payload key `__proto__` invokes the
    Object.prototype setter and REPLACES the target''s prototype chain with attacker-controlled data.
    Validate the parsed value with a schema before merging, or build a fresh object from an explicit
    allowlist of keys.'
  languages:
  - typescript
  - javascript
  severity: ERROR
  metadata:
    category: security
    cwe: 'CWE-1321: Improperly Controlled Modification of Object Prototype Attributes'
    owasp: A03:2021
    confidence: MEDIUM

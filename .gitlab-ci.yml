# GitLab CI/CD — session-orchestrator
# Version: 1.2 | 2026-07-30
#
# Pipeline: security → validate → test → verify → coverage → gate
#
# The LAST stage is a fan-in (`pipeline-gate`). Before it existed, dropping a
# gate from this file — or having one silently ruled out — produced a GREEN
# pipeline that had verified nothing. Two measured incidents drove #929/#933:
#   - pipeline 6808 (push, feat/instruction-ablation): GREEN with exactly ONE
#     job (plugin-schema-validate). No lint, no typecheck, no test, no coverage.
#   - pipeline 6815 (MR !24): schema-drift-check reported SUCCESS in 17s — far
#     too fast to clone the baseline repo; it had taken the soft-skip path.
# See the `pipeline-gate` job for how each of those is now caught.
#
# Why GitLab CI rather than GitHub Actions:
#   The canonical vault-frontmatter schema lives in a *private* GitLab repo
#   (<your-gitlab-host>/infrastructure/projects-baseline, project ID 52).
#   Cross-project access during CI requires same-instance authentication via
#   SCHEMA_DRIFT_TOKEN (deploy token/PAT) — a masked CI variable with
#   read-only access to the private projects-baseline repo (project ID 52).
#   GitHub Actions has no equivalent for private GitLab resources, so the
#   schema-drift gate must live here.
#
# GitHub Actions mirror:
#   .github/workflows/test.yml intentionally runs a *subset* of CI: lint,
#   typecheck, and the bash + vitest test suites (no schema-drift check — it
#   needs a token for a private GitLab project). It carries a `gate` job that
#   mirrors `pipeline-gate` below, because GitHub has the same class of hole in
#   a different shape: a dependent job there is silently SKIPPED rather than
#   failed, and a skipped check is not a failing check. Keep the two fan-ins in
#   step; the rest of that file remains a deliberate subset.

# 2026-05-20 — Phase-4 Stufe-B cutover to hetzner-autoscaler-v2 (runner_id=3)
default:
  tags: [linux, hetzner-auto]

stages:
  - security
  - validate
  - test
  - verify
  - coverage
  - gate
  - scheduled

# ---------------------------------------------------------------------------
# workflow:rules — exactly ONE pipeline per change (#933 Loch 2)
#
# The gate jobs below now also run on plain branch pipelines (previously only
# on MRs + the default branch, which left a pushed branch protected by a single
# manifest check — measured: pipeline 6808 was green with 1 job). Running the
# gates on branch pipelines AND on the MR pipeline would double every push once
# an MR is open, so this is the canonical GitLab "avoid duplicate pipelines"
# workflow: while an MR is open for the source branch, only the MR pipeline runs.
#
# Consequence to be aware of: tag pushes no longer create a pipeline. They
# previously created one with zero matching jobs (a config error), so this is a
# strict improvement — but a future release job must add a $CI_COMMIT_TAG rule
# HERE as well as on the job.
# ---------------------------------------------------------------------------
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Shared rule set for every blocking gate. Anchored rather than repeated so a
# gate cannot drift out of the set unnoticed. Schedules are excluded because a
# scheduled pipeline exists only to run `vault-watcher` — $CI_COMMIT_BRANCH is
# set on scheduled pipelines too, so without the first rule every schedule would
# drag the whole test suite along.
.gate-rules: &gate-rules
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH

variables:
  # Pinned to a specific 24.x patch (SEC-020: no floating minor/patch drift).
  # A `@sha256:` image digest pin is preferred for full immutability — bump
  # this patch and the digest together when updating. Used by every job that
  # runs `node:${NODE_VERSION}` (or `node:${NODE_VERSION}-alpine`).
  NODE_VERSION: "24.18.0"
  # Bump to bust stale CI cache
  CI_CACHE_VERSION: "v3"

# ---------------------------------------------------------------------------
# Shared setup anchor — npm install on alpine
# ---------------------------------------------------------------------------
.node-setup: &node-setup
  image: node:${NODE_VERSION}
  before_script:
    # jq is required by scripts/parse-config.sh, which is shelled out to
    # by tests/lib/config.test.mjs for bash↔node parity verification.
    # Guard for Mac shell-executor runners: image: directive is ignored on
    # the shell executor, so apt-get (Linux-only) isn't available. On macOS
    # jq is pre-installed via Apple Command Line Tools (/usr/bin/jq). Only
    # install when jq is genuinely absent (Linux Docker path). See #408.
    - command -v jq >/dev/null || (apt-get update -qq && apt-get install -y --no-install-recommends jq)
    # git identity — required by subprocess-level integration tests that
    # shell out to git inside ephemeral tmp repos (multi-session-registry,
    # hook-smoke). Without this the runner throws "Author identity unknown"
    # and 30+ tests fail. CI-only; local dev inherits user's git config.
    - git config --global user.email "ci@session-orchestrator.local"
    - git config --global user.name "CI Runner"
    - npm ci
    # package-manager guard (#715) — verify node_modules matches the
    # committed npm lockfile immediately after a fresh install. This is what
    # actually exercises w1/w2/w3 (working-tree drift) against a REAL
    # node_modules tree in every node job — npm's own `preinstall`/`pretest`
    # lifecycle hooks are DEAD under this repo's `ignore-scripts=true`
    # (.npmrc), so they cannot be relied on here either. The standalone
    # `package-manager-guard` job below covers only the cheap committed-tree
    # (c1/c2) invariant, with no node_modules required.
    - node scripts/check-package-manager.mjs
    # Install nested vault-sync deps (zod, yaml) — ignored by root npm ci.
    # Use `npm install`: skills/vault-sync/package-lock.json is gitignored (.gitignore),
    # so it is absent in CI's fresh clone — `npm ci` would EUSAGE-fail (no lockfile).
    - (cd skills/vault-sync && npm install --no-audit --no-fund)
  cache:
    key:
      prefix: ${CI_CACHE_VERSION}
      files:
        - package-lock.json
    paths:
      - node_modules/

# ---------------------------------------------------------------------------
# Stage: security (#350, #351)
#
# Three gates run before tests:
#   gitleaks-scan          — scans the working tree for committed secrets
#   npm-audit              — runs `npm audit --audit-level=high --omit=dev`
#   npm-audit-signatures   — verifies registry signatures on installed tarballs
#
# All three fail the pipeline on findings. The npm-audit job uses
# --audit-level=high (matches `audit-level=high` in .npmrc); to bypass a
# false positive temporarily, override per-pipeline via CI variable
# AUDIT_LEVEL=critical (still gates on critical) — never silently ignore.
#
# npm-audit and npm-audit-signatures answer DIFFERENT questions and neither
# subsumes the other: `npm audit` asks "does a published advisory match a
# version in my tree?" (a CVE database lookup); `npm audit signatures` asks
# "was each tarball I actually installed signed by the registry that claims to
# have published it?" (a cryptographic provenance check). A tampered tarball
# served under a legitimate version number has no advisory and passes the
# first gate; the second is what catches it. This is the npm-native counterpart
# to pnpm's `trust-policy=no-downgrade`, which .claude/rules/security.md
# § SEC-020 mandates and which npm has no equivalent config key for.
# ---------------------------------------------------------------------------

gitleaks-scan:
  stage: security
  # zricethezav/gitleaks:latest has `gitleaks` as ENTRYPOINT, which causes
  # the default GitLab Runner script-wrapper (`sh -c <script>`) to fail with
  # `unknown command "sh" for "gitleaks"`. Override the entrypoint to an
  # empty string so the runner can invoke `sh` directly. See #408 (recurrence
  # of cb3e942-era CI-image breakage).
  image:
    # Pinned (SEC-020: no floating `:latest` — a moving tag is a supply-chain
    # risk). A `@sha256:` digest pin is preferred for full immutability; bump
    # the tag and digest together when updating.
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  interruptible: true
  timeout: 5m
  script:
    - gitleaks detect --source . --redact --no-banner --config .gitleaks.toml
  rules: *gate-rules

npm-audit:
  stage: security
  image: node:${NODE_VERSION}
  interruptible: true
  timeout: 5m
  variables:
    AUDIT_LEVEL: "high"
  script:
    # --omit=dev: only production deps gate the pipeline. Dev deps may
    # carry advisories without affecting shipped runtime.
    # --audit-level: high by default; set AUDIT_LEVEL=critical via CI
    # variable to temporarily lower the bar while triaging a false positive.
    - npm audit --audit-level=${AUDIT_LEVEL} --omit=dev
  rules: *gate-rules

# ---------------------------------------------------------------------------
# npm-audit-signatures — registry-signature provenance gate (SEC-020)
#
# BLOCKING by construction. Measured 2026-08-22 at 141d418 on npm 11.8.0:
#   $ npm audit signatures
#   audited 332 packages in 3s
#   332 packages have verified registry signatures
#   44 packages have verified attestations
#   exit=0
# A gate that can be binding today is wired binding today — there is no
# allow_failure here and no exit code is excused. Contrast schema-drift-check:
# once advisory-only for lack of a CI token, now ARMED (2026-09-03, #1175) —
# SCHEMA_DRIFT_TOKEN is provisioned and SCHEMA_DRIFT_OPTIONAL: "false" at both
# sites (this job and `pipeline-gate`), so a missing token is exit 4
# (MISCONFIGURED), a hard failure, not an amber skip.
#
# WHY THE SCRIPT IS NOT A BARE `npm audit signatures`:
# npm collapses two categorically different outcomes onto the SAME exit 1 —
# "the tarballs did not verify" and "I could not ask the registry". Measured,
# same machine, minutes apart:
#   $ npm audit signatures --json --registry=https://registry.invalid.example/
#   exit=1  stdout: {"error":{"code":"ENOTFOUND","summary":"request to ... failed"}}
#   $ npm audit signatures --json   # in a tree with no node_modules
#   exit=1  stdout: {"error":{"summary":"found no dependencies to audit ..."}}
# Left bare, a DNS blip or a half-populated node_modules would surface as
# "npm-audit-signatures FAILED" and send the next reader hunting a supply-chain
# compromise that never happened — the exact confusion #933 removed from
# schema-drift-check, where "you forgot the token" and "the schema diverged"
# used to be the same red. So the ENVELOPE is classified, never the exit code:
# the `error` key means the query never completed, and its absence means the
# answer is real. Both remaining `invalid`/`missing` arrays empty is the only
# green. A job that compared nothing must never report the same green as a job
# that compared everything.
#
# Exit-code taxonomy (all hard failures; the codes carry the DIAGNOSIS):
#   0  VERIFIED     every installed tarball carries a valid registry signature
#   1  FAILED       the query completed and returned invalid/missing signatures
#                   <- the only code that is a signature verdict
#   5  UNAVAILABLE  the query itself failed (registry unreachable, no installed
#                   tree, unparseable output). NOT a verdict; nothing compared.
#
# `<<: *node-setup` is REQUIRED, not cosmetic: `npm audit signatures` reads the
# installed tree, not the lockfile. Measured in a temp dir holding only
# package.json + package-lock.json -> "found no dependencies to audit that were
# installed from a supported registry" (exit 1). Without npm ci this job would
# be structurally incapable of verifying anything.
# ---------------------------------------------------------------------------

npm-audit-signatures:
  <<: *node-setup
  stage: security
  interruptible: true
  timeout: 5m
  script:
    # One folded block on purpose: a single shell scope, one exit decision, and
    # no value passes through a `$(...)` capture that a stray npm notice could
    # corrupt (.claude/rules/bash-harness-pitfalls.md #2/#3). `|| true` keeps
    # the runner's `set -e` from aborting before the classifier has run — npm
    # exits 1 on BOTH failure classes and the whole point is to tell them apart.
    - >
      set -u;
      npm audit signatures --json > sig-audit.json 2> sig-audit.err || true;
      echo "[sig-audit] npm stderr follows (empty on a clean verification):";
      cat sig-audit.err || true;
      node -e 'const fs=require("fs"); let j=null; try{j=JSON.parse(fs.readFileSync("sig-audit.json","utf8"))}catch(e){j=null} if(!j||j.error){const d=j&&j.error?((j.error.code?j.error.code+": ":"")+(j.error.summary||"no summary")):"npm produced no parseable JSON envelope on stdout"; console.log("[sig-audit] RESULT: UNAVAILABLE (exit 5, hard failure). The registry query did not complete: "+d); console.log("[sig-audit] This is NOT a signature verdict - nothing was compared, so it does not mean the signatures are bad. Check registry reachability and that npm ci populated node_modules, then re-run."); process.exit(5)} const inv=j.invalid||[]; const mis=j.missing||[]; if(inv.length||mis.length){console.log("[sig-audit] RESULT: FAILED (exit 1, hard failure). The query DID complete and returned "+inv.length+" invalid and "+mis.length+" missing registry signature(s). This IS a verdict - treat it as a supply-chain finding."); console.log(JSON.stringify({invalid:inv,missing:mis},null,2)); process.exit(1)} console.log("[sig-audit] RESULT: VERIFIED (exit 0). The query completed; every installed tarball carries a valid registry signature (0 invalid, 0 missing).");'
  rules: *gate-rules

# ---------------------------------------------------------------------------
# semgrep — static analysis over the repo's own source (SEC-020 / #1127)
#
# WHY THIS EXISTS AT ALL. `.claude/rules/security.md` claimed "Semgrep SAST
# (65+ custom rules in .semgrep.yml + 4 managed rulesets) in CI" since the
# 2026-04-28 baseline-vendor commit 9a35a2e. Measured 2026-08-22: `.semgrep.yml`
# absent, 0 references in this file and in .github/workflows/. The claim was a
# true statement about the operator's APP repos that travelled into a CLI repo
# unchecked.
#
# WHY THE RULESET IS 25 RULES AND NOT THE BASELINE'S 64. Vendoring without
# adapting is what produced the false claim; copying 64 rules would repeat it.
# Measured, in three passes at 141d418 (474-495 files):
#   * baseline verbatim          -> 78 findings, ALL false positives. Five rules
#     fire only on this repo's shape: path.join(CONST,'literal'), a literal
#     createHash('sha256'), new RegExp(re.source, flags) rebuilding a literal
#     regex, `return {error: err.message}` from an internal fn to its OWN caller
#     (SEC-009 governs HTTP responses; there is no client here), and console.log
#     (`no-console` is deliberately off — eslint.config.js:38). Removed.
#   * 32 of the remaining 59 were STRUCTURALLY DEAD: `paths.include` pointing at
#     **/src/, **/Dockerfile, **/middleware.ts — a Next.js layout this repo does
#     not have. Their green meant "nothing was examined", not "nothing is wrong"
#     — including unsafe-command-injection, unsafe-shell-spawn and unsafe-eval,
#     the three that matter most for a tool that spawns processes constantly.
#     Path scope dropped where the PATTERN applies here; rule dropped where it
#     needs a req/res/JSX surface (25 rules) or an auth/secret surface (9 rules,
#     e.g. timing-unsafe-comparison — a `===` on strings is only a timing attack
#     when the operands are secrets; unscoped it produced 12,001 hits).
#   * the surviving 25 -> 27 real findings, and a synthetic probe confirmed the
#     ruleset BITES: exec("ls " + u) now trips 3 distinct rules.
#
# WHY --baseline-commit AND NOT A FULL SCAN. Those 27 pre-existing findings are
# triaged in #1127 (6 are genuine: JSON.stringify used as shell quoting in
# durable-telemetry.mjs, an unquoted ${ref} in gate-helpers.mjs). A job that is
# red on all 27 from day one gets ignored within a week — the inverse of a guard
# that is green without biting, and the same instrument failure HR-101 names.
# So the gate blocks on what a change ADDS, which is the property CI can enforce
# without a human triaging 27 lines on every pipeline.
#
# Exit codes (semgrep, measured 2026-08-22 on 1.161.0):
#   0  no NEW findings
#   1  new findings introduced by this change  <- the verdict; hard failure
#   7  config unreadable / unparseable         <- NOT a verdict; hard failure
# Unlike `npm audit signatures`, semgrep already separates "found something"
# from "could not run", so no envelope classification is needed here.
# ---------------------------------------------------------------------------

semgrep:
  stage: security
  image: semgrep/semgrep:1.161.0
  interruptible: true
  timeout: 10m
  variables:
    SEMGREP_SEND_METRICS: "off"
    GIT_DEPTH: "0"   # --baseline-commit needs real history, not a shallow clone
  script:
    - >
      set -eu;
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}";
      if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
        echo "[semgrep] no usable baseline ref - scanning the full tree in REPORT-ONLY mode.";
        echo "[semgrep] This is NOT a pass: pre-existing findings are expected here (measured 25 on 2026-08-28 @ 30940cb — re-measure before trusting this number).";
        semgrep scan --config .semgrep.yml --metrics=off scripts/ hooks/ skills/ agents/ commands/ monitors/ pi/ || true;
        echo "[semgrep] RESULT: REPORTED (exit 0). Nothing was gated - no baseline to diff against.";
      else
        echo "[semgrep] gating on findings NEW since $BASE";
        semgrep scan --config .semgrep.yml --error --metrics=off --baseline-commit "$BASE" scripts/ hooks/ skills/ agents/ commands/ monitors/ pi/;
        echo "[semgrep] RESULT: CLEAN (exit 0). This change introduced no new findings.";
      fi
  rules: *gate-rules

# ---------------------------------------------------------------------------
# Stage: validate
#
# plugin-schema-validate — verify .claude-plugin manifests conform to the
# canonical schemastore.org JSON Schema definitions (issue #433).
# Uses scripts/validate-plugin-manifests.mjs (project-pinned AJV via
# ajv-loader.mjs, host-pinned schemastore fetch; replaces unpinned global
# ajv-cli — #475). Runs on changes to .claude-plugin/*.json or CI config.
# ---------------------------------------------------------------------------

# lint / typecheck — the canonical GitLab pipeline gates code style + types
# here (previously these ran only in the GitHub mirror, leaving the canonical
# pipeline blind to lint/type regressions). `<<: *node-setup` installs
# node_modules, so `npm run *` resolves the local eslint bin from
# node_modules/.bin (no PATH export needed — npm-run handles it; cf. TS-001).
lint:
  stage: validate
  <<: *node-setup
  interruptible: true
  timeout: 10m
  allow_failure: false
  script:
    # npm run lint → `eslint .`
    - npm run lint
  rules: *gate-rules

typecheck:
  stage: validate
  <<: *node-setup
  interruptible: true
  timeout: 10m
  allow_failure: false
  script:
    # npm run typecheck → `node scripts/typecheck.mjs`
    - npm run typecheck
  rules: *gate-rules

owner-leakage:
  stage: validate
  <<: *node-setup
  interruptible: true
  timeout: 5m
  allow_failure: false
  script:
    - node scripts/lib/validate/check-owner-leakage.mjs "$CI_PROJECT_DIR"
  rules: *gate-rules

# fixture-shape — scan tracked tests/**/*.{mjs,ts,js} for live-credential
# shape patterns (sk_live_, xoxb-<digits>, AKIA…, AIzaSy…) that would block
# a public GitHub-mirror push. Parity with the pre-commit hook (#556).
fixture-shape:
  stage: validate
  <<: *node-setup
  interruptible: true
  timeout: 5m
  allow_failure: false
  script:
    - node scripts/lib/validate/check-test-fixture-shapes.mjs "$CI_PROJECT_DIR"
  rules: *gate-rules

plugin-schema-validate:
  stage: validate
  <<: *node-setup
  interruptible: true
  timeout: 5m
  script:
    - node scripts/validate-plugin-manifests.mjs "$CI_PROJECT_DIR"
  # Was `rules: changes: [.claude-plugin/*.json, .gitlab-ci.yml]`. Dropped for
  # two reasons: (1) a `changes:` rule is itself a fail-open shape — a manifest
  # can break from a change to a file OUTSIDE the list and the gate never fires;
  # (2) it was the ONLY job that ran on a plain branch pipeline, which is how
  # pipeline 6808 came out green with a single job. Now uniform with every other
  # gate, and hard-needed by pipeline-gate.
  rules: *gate-rules
  allow_failure: false

# hook-import-set-check — drift guard for the committed hook-reachable
# allowlist hooks/_lib/hook-import-set.json (#1224). That file gates
# hooks/post-edit-import-probe.mjs: a stale allowlist does not make the probe
# noisy, it makes it SILENT for exactly the modules that just became
# hook-reachable — the 2026-09-04 shape where a broken helper blocked every
# Bash/Edit/Write call host-wide for ~8 minutes. The .husky/pre-commit stage
# covers the same drift locally but is `--no-verify`-bypassable, so this is the
# mechanical backstop. Node-stdlib only, no extra deps, sub-second.
hook-import-set-check:
  stage: validate
  <<: *node-setup
  interruptible: true
  timeout: 5m
  script:
    - node scripts/generate-hook-import-set.mjs --plugin-root "$CI_PROJECT_DIR" --check
  rules: *gate-rules
  allow_failure: false

# package-manager-guard — recurrence guard for the pnpm/npm working-tree drift
# incident class (#715): a bare `pnpm install` at repo root silently rewrites
# node_modules to a pnpm layout, and a stray gitignored pnpm-lock.yaml never
# shows up in CI's own clone. This job asserts the COMMITTED tree invariant
# (pnpm-lock.yaml never tracked, package-lock.json tracked) via `git
# ls-files` — the cheap, node_modules-free half of the same guard that is
# also wired into the `.node-setup` before_script above (real node_modules,
# right after `npm ci`) and into `.husky/pre-commit` locally. npm's own
# `preinstall`/`pretest` lifecycle hooks are DEAD under this repo's
# `ignore-scripts=true` (.npmrc) — they are NOT part of the enforcement
# chain. The script is Node-stdlib-only and needs no node_modules, so this
# job intentionally skips the shared `.node-setup` anchor (no npm ci) to
# stay cheap — same lightweight image-only pattern as npm-audit above.
package-manager-guard:
  stage: validate
  image: node:${NODE_VERSION}
  interruptible: true
  timeout: 5m
  allow_failure: false
  script:
    - node scripts/check-package-manager.mjs
  rules: *gate-rules

# test-value-bans — ADVISORY scan for the lint-enforceable test bans in
# .claude/rules/testing.md § "Lint-Enforceable Test Bans" (B1 dynamic-set count
# pins, B2 prose pins, B3/B4 hook-decision contract copies, B5 date time-bombs).
# NON-BLOCKING by design: the scanner is warn-only and always exits 0 when the
# scan completes, and `allow_failure: true` means even a future non-zero exit
# (tool error) cannot gate the pipeline — findings surface in the job log only.
# Node-stdlib-only (git ls-files + fs), so it skips the `.node-setup` anchor (no
# npm ci) — same lightweight image-only pattern as package-manager-guard above.
test-value-bans:
  stage: validate
  image: node:${NODE_VERSION}
  interruptible: true
  timeout: 5m
  allow_failure: true
  script:
    - node scripts/lib/validate/check-test-value-bans.mjs "$CI_PROJECT_DIR"
  rules: *gate-rules

# ---------------------------------------------------------------------------
# Stage: test
# ---------------------------------------------------------------------------

test:
  <<: *node-setup
  stage: test
  interruptible: true
  parallel: 2    # 2 shards — GitLab injects CI_NODE_INDEX (1-based) + CI_NODE_TOTAL=2
  timeout: 10m   # per-shard ceiling over the inner 600s per-shard vitest cap
  script:
    # Pass/fail is read from vitest's machine-readable JSON result via a
    # FAIL-CLOSED verifier — never by grepping stdout markers. The old
    # grep-the-markers heuristic shipped a 12-failure suite as GREEN: under
    # runner contention the suite ran 257s > the 240s `timeout` cap, vitest was
    # killed BEFORE printing its failure-summary block, `|| true` swallowed the
    # kill, and the `FAIL`/`✗` grep matched nothing (the verbose reporter marks
    # failures with `×`). Same silent-regression class as the 8-pipeline incident
    # (CLAUDE.md Critical Gotchas). See scripts/ci/assert-vitest-green.mjs.
    #
    # SHARDED (2 shards × 600s) on the Hetzner Linux autoscaler (tags: hetzner-auto,
    # Docker node:24 — runs as ROOT). The full ~12.1k-test suite (2026-07-17) is slow on
    # a small autoscaled instance; a single un-sharded job's inner `timeout` killed vitest
    # before it wrote the onFinished JSON, so the verifier (correctly) failed CLOSED
    # on the missing file even though the code was green locally. The fix is to SHARD
    # the suite, NOT to widen blindly: `parallel: 2` splits the ~450 files into two
    # independent shards via vitest's `--shard=i/n`, each on its own autoscaled runner.
    # Each shard self-verifies its own JSON with a per-shard floor.
    #
    # Cap history: pipeline #5844 ran 3 shards × 660s — shard 2/3 took 675s > 660s
    # (uneven file-weight: vitest --shard splits by file COUNT, not duration, so one
    # shard collected the heavy cross-process/lock/backfill files) → killed → ENOENT.
    # Fix: 4 shards (smaller per-shard weight) + a 900s inner cap (headroom over the
    # observed 675s). NOTE the runner runs as ROOT, so chmod-readonly-to-force-a-write-
    # failure tests are guarded with skipIf(isRoot) (tests/_helpers/perms.mjs) — root
    # bypasses permission bits, which previously surfaced as real shard failures.
    #
    # 2026-07-17 (#702): 4→2 shards — the 4-way split was a #685-era workaround; real
    # green times ~70-85s/shard made 4 spin-ups pure overhead. Floor 1500→3000 (~50% of
    # the 6.0k even split), inner cap 900s→600s.
    #
    # The JSON file is written by vitest at onFinished — after all tests run:
    #   - real failures            → JSON success:false  → verifier exits 1
    #   - run truncated/killed      → JSON absent/partial → verifier fails CLOSED
    #   - post-completion exit-hang → JSON success:true   → verifier passes (the
    #                                 hung non-zero exit is swallowed by `|| true`)
    # The inner per-shard `timeout` (600s) must EXCEED a single shard's true runtime
    # so vitest reaches onFinished and writes the JSON. Per-shard result/log files are
    # suffixed with $CI_NODE_INDEX so concurrent shards never clobber one another.
    #
    # Per-shard floor --min-tests=3000: ~12.1k/2 ≈ 6.0k real tests per shard, so 3000
    # (~50% of the even split — the prior 4-shard floor of 1500 was ~50% of that split's
    # ~3021) still clears the genuine subset while catching a truncated/empty shard. On a
    # hang the verifier is passed --log so it names the test files that were in-flight at
    # the kill (self-diagnosing) instead of a bare ENOENT.
    - 'rm -f /tmp/vitest-result-$CI_NODE_INDEX.json'   # stale-file guard on reused shell-executor hosts
    - 'timeout --preserve-status 600s npm test -- --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL --reporter=default --reporter=json --outputFile=/tmp/vitest-result-$CI_NODE_INDEX.json --no-color 2>&1 | tee /tmp/vitest-$CI_NODE_INDEX.log || true'
    - 'tail -40 /tmp/vitest-$CI_NODE_INDEX.log'
    - 'node scripts/ci/assert-vitest-green.mjs /tmp/vitest-result-$CI_NODE_INDEX.json --min-tests=3000 --log=/tmp/vitest-$CI_NODE_INDEX.log'
  rules: *gate-rules

# ---------------------------------------------------------------------------
# Stage: coverage (#263)
#
# Gated at 70% lines/functions/statements, 60% branches via vitest.config.mjs
# thresholds. Runs only on main + MRs targeting main. Fails the pipeline if
# coverage regresses below the threshold.
# ---------------------------------------------------------------------------

coverage:
  <<: *node-setup
  stage: coverage
  interruptible: true
  timeout: 30m   # headroom over the inner 1500s cov cap (instrumentation is slower than plain test)
  needs:
    - test
  script:
    # Same fail-closed JSON verifier as the `test` job (see its comment +
    # scripts/ci/assert-vitest-green.mjs). Coverage takes longer than plain
    # tests (instrumentation overhead), so the inner cap is 1500s (25m) under
    # the 30m job ceiling — the cap must EXCEED the true instrumented runtime so
    # vitest writes the JSON before any tinypool exit-hang is killed. The
    # cobertura artifact + the threshold-breach grep below are SEPARATE gates
    # from test-green: the JSON `success` field reflects test pass/fail, not the
    # coverage threshold.
    - 'rm -f /tmp/cov-result.json'   # stale-file guard on reused shell-executor hosts
    # --exclude excludes the heavy 3-subprocess integration test from the v8-instrumented
    # coverage lane ONLY (it still runs in the `test:` shards). Per #691 durable fix: it flakes
    # only under v8 coverage instrumentation (contention-fragile in the slowest lane) and its
    # coverage is redundant — 128 unit tests cover the same hook/registry lines.
    # #686 item 1 (shard re-eval) deferred — see issue; no functional shard change here.
    - 'timeout --preserve-status 1500s npm run test:coverage -- --exclude "tests/integration/multi-session-registry.test.mjs" --reporter=default --reporter=json --outputFile=/tmp/cov-result.json --no-color 2>&1 | tee /tmp/cov.log || true'
    - 'tail -60 /tmp/cov.log'
    - 'node scripts/ci/assert-vitest-green.mjs /tmp/cov-result.json'
    # Verify the cobertura artifact was actually written.
    - 'test -f coverage/cobertura-coverage.xml && echo "[ci] coverage artifact present"'
    # Threshold gate: vitest prints "Coverage for X (n%) does not meet … below".
    - '! grep -q "Coverage for .* .* below" /tmp/cov.log'
    # Marker for pipeline-gate — MUST stay the LAST script line. `artifacts.when`
    # is `always` here (the cobertura report is wanted even on failure), so the
    # marker's guarantee is its POSITION, not the upload condition: any failing
    # line above aborts the job before the marker is ever written.
    - 'mkdir -p .ci-markers && echo "coverage verified $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ci-markers/coverage.ok'
  coverage: '/^Lines\s+:\s+\d+(?:\.\d+)?%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
      - .ci-markers/
    expire_in: 2 weeks
  # Deliberately NOT *gate-rules: coverage is the single most expensive job in
  # the pipeline (measured 148s in pipeline 6816 — every other job is ≤ 100s)
  # and it re-runs the SAME suite the `test` job already ran on every branch
  # pipeline, only under v8 instrumentation. Its unique signal is the threshold
  # check, which is a merge-boundary concern. So it stays on MR + default only,
  # and `pipeline-gate` states in plain text on every branch pipeline that
  # coverage was NOT measured — absent, but never silently absent.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage: verify
#
# REQUIRES: a GitLab Deploy Token or PAT stored as the masked CI variable
# SCHEMA_DRIFT_TOKEN with read-only access to infrastructure/projects-baseline
# (project ID 52). See docs/ci-setup.md for step-by-step token creation.
#
# If SCHEMA_DRIFT_TOKEN is unset, the job no longer exits 0 (#933 Loch 1).
# A green tick meant "verified" to every reader, and pipeline 6815 showed
# schema-drift-check SUCCESS after 17s — a shallow clone plus a schema diff
# cannot finish in 17s, so that tick was the soft-skip, not a check. The job now
# exits 3, which `allow_failure.exit_codes` renders as an amber WARNING: not a
# pass, and still not a hard block while the token is genuinely unconfigured.
#
# EXIT-CODE TAXONOMY — one code per FACT. Every outcome below also prints its
# own `[schema-drift] RESULT: <STATE>` line, so the log answers "what happened"
# without the reader having to know the allow_failure convention:
#
#   0  IN-SYNC        the check ran and the vendored schema matches canonical
#   1  DRIFT          the check ran and found divergence  <- the only drift code
#   3  SKIPPED        no token, and SCHEMA_DRIFT_OPTIONAL=true declares that OK
#   4  MISCONFIGURED  no token, but the gate is required — the check never ran
#   5  UNAVAILABLE    token present, baseline clone failed (scope/expiry/network)
#
# 3, 4 and 5 all mean NOT VERIFIED and none of them is a drift verdict. Keeping
# them off code 1 is the point: before this split, "you forgot the token" and
# "the schema has diverged" were the same red, so the first person to see it
# would go looking for a schema diff that does not exist. Only 3 is in
# `allow_failure.exit_codes`; 4 and 5 are hard failures by construction.
#
# ARMED (2026-09-03, #1175): SCHEMA_DRIFT_OPTIONAL is "false" in BOTH places
# below — this job and `pipeline-gate`. Token `session-orchestrator-ci-schema-
# drift` (id 53, read_repository, access_level 20, expires 2027-09-01) is
# minted on infrastructure/projects-baseline (project 52) and set as the
# masked CI variable SCHEMA_DRIFT_TOKEN on this project (74, unprotected).
# Proven both ways before the flip: GREEN pipeline 8358 @ dc9522dd
# (branch proof/1175-schema-drift-green) ran schema-drift-check job #84625
# with the token, cloned the baseline, printed `RESULT: IN-SYNC (exit 0)`,
# and pipeline-gate succeeded; RED pipelines 8355-8357 @ bca78dae
# (branch proof/1175-schema-drift-red, bogus enum value) printed
# `sync-vault-schema: drift detected`, exited 1 (not in allow_failure's
# exit_codes [3]), and pipeline-gate never ran. The mirroring is asserted by
# tests/ci/schema-drift-check.test.mjs, so a half-flip (or a template refresh
# reverting one site) fails the suite locally before it reaches a pipeline.
# ---------------------------------------------------------------------------

schema-drift-check:
  <<: *node-setup
  stage: verify
  interruptible: true
  timeout: 10m
  # exit 3 == "no token AND the absence is explicitly declared acceptable".
  # EVERY other non-zero exit stays a hard pipeline failure — notably exit 1
  # from real drift, exit 4 from a missing token without the opt-out, and
  # exit 5 from a token that cannot reach the baseline repo. Widening this list
  # would re-open the hole #933 closed, one code at a time.
  allow_failure:
    exit_codes:
      - 3
  needs:
    - test
  variables:
    # Committed, review-visible enforcement. Flipped to "false" 2026-09-03
    # (#1175) once SCHEMA_DRIFT_TOKEN was minted and set as a masked CI
    # variable — see docs/ci-setup.md § Activation status for the full record.
    # Missing/expired token now hard-fails (exit 4), not amber-skips.
    SCHEMA_DRIFT_OPTIONAL: "false"
  script:
    # Fail-visible guard. The old form was `exit 0` — a job that had checked
    # nothing reported the same green as a job that had checked everything.
    - >
      if [ -z "${SCHEMA_DRIFT_TOKEN}" ]; then
        echo "[schema-drift] NOT VERIFIED: SCHEMA_DRIFT_TOKEN is not set — no schema drift check was performed.";
        echo "[schema-drift] See docs/ci-setup.md to configure a deploy token for infrastructure/projects-baseline.";
        if [ "${SCHEMA_DRIFT_OPTIONAL}" = "true" ]; then
          echo "[schema-drift] RESULT: SKIPPED (exit 3, allow_failure -> amber WARNING). SCHEMA_DRIFT_OPTIONAL=true declares the missing token acceptable. This is NOT a pass and NOT a drift verdict — nothing was compared.";
          exit 3;
        fi;
        echo "[schema-drift] RESULT: MISCONFIGURED (exit 4, hard failure). SCHEMA_DRIFT_OPTIONAL is not 'true', so the token is required. This is NOT drift — the check never ran; provision SCHEMA_DRIFT_TOKEN per docs/ci-setup.md.";
        exit 4;
      fi;
      echo "[schema-drift] token present — comparing the vendored schema against canonical. From here, exit 1 means real drift."
    # Clone the canonical schema source using a deploy token or PAT.
    # SCHEMA_DRIFT_TOKEN must be a masked CI variable with read_repository
    # scope on infrastructure/projects-baseline (project ID 52).
    # See docs/ci-setup.md for token creation steps.
    # A clone failure is a CREDENTIAL/NETWORK fact, not a schema fact. Left bare,
    # it exits with git's own code and reads as "the schema-drift gate failed",
    # sending the first responder to look for a diff that does not exist. exit 5
    # is outside allow_failure, so this still hard-fails — it just says why.
    - >
      git clone --depth 1
      "https://oauth2:${SCHEMA_DRIFT_TOKEN}@${CI_SERVER_HOST}/infrastructure/projects-baseline.git"
      /tmp/projects-baseline
      || { echo "[schema-drift] RESULT: UNAVAILABLE (exit 5, hard failure). Could not clone infrastructure/projects-baseline — check SCHEMA_DRIFT_TOKEN scope (read_repository), expiry, and masking. This is NOT drift.";
      exit 5; }
    # Run the drift-check — exits 0 if in sync, 1 if the local vendored copy
    # has diverged from the canonical schema. Diff is emitted to stderr.
    - >
      node scripts/sync-vault-schema.mjs
      --check
      --canonical /tmp/projects-baseline/packages/zod-schemas/src/vault-frontmatter.ts
    # Marker — reachable ONLY from the path where the check actually ran and
    # passed. The exit-3 soft path returns long before this line, so the marker's
    # presence is the one honest answer to "did this pipeline verify the schema?"
    - >
      mkdir -p .ci-markers
      && echo "schema-drift verified $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ci-markers/schema-drift.ok
      && echo "[schema-drift] RESULT: IN-SYNC (exit 0) — the vendored schema matches canonical, and this pipeline can prove it."
  artifacts:
    when: on_success
    paths:
      - .ci-markers/
    expire_in: 1 day
  rules: *gate-rules

# ---------------------------------------------------------------------------
# Stage: gate — fan-in (#933 Loch 3)
#
# Before this job, nothing depended on anything: the two `needs:` edges in the
# file (coverage→test, schema-drift-check→test) had no consumer, so deleting a
# gate — or having one quietly ruled out — cost nothing and showed nothing.
#
# Two different mechanisms are needed, because "gate is gone" and "gate ran but
# verified nothing" are different failures:
#
# 1. HARD `needs:` for every gate that runs on every non-scheduled pipeline.
#    VERIFIED, not assumed (2026-07-30, POST /projects/74/ci/lint dry_run on
#    GitLab 18.11.2-ee): needing a job that is absent from the pipeline is a
#    pipeline-CREATION ERROR, not a silent skip —
#      "'job_b_hard_needs' job needs 'job_a' job, but 'job_a' does not exist in
#       the pipeline. This might be because of the only, except, or rules
#       keywords. To need a job that sometimes does not exist in the pipeline,
#       use needs:optional."
#    So deleting a gate from this file can no longer yield a green pipeline; it
#    yields no pipeline at all. That is the loudest available failure mode, and
#    it is why these needs are deliberately NOT optional.
#
# 2. MARKER ARTIFACTS for the two conditional jobs. A hard `needs:` on them
#    would break pipeline creation on the very pipelines where their absence is
#    legitimate, and — worse for schema-drift-check — an allow_failure job never
#    blocks a dependent job, so `needs:` alone cannot see the amber warning.
#    Each writes its marker only on the path where it truly verified something.
# ---------------------------------------------------------------------------

pipeline-gate:
  stage: gate
  image: node:${NODE_VERSION}
  interruptible: true
  timeout: 5m
  allow_failure: false
  variables:
    # Must mirror schema-drift-check's value: one flag, two enforcement points.
    SCHEMA_DRIFT_OPTIONAL: "false"
  needs:
    # Hard — absence is a pipeline-creation error (see mechanism 1 above).
    - gitleaks-scan
    - npm-audit
    - npm-audit-signatures
    - semgrep
    - lint
    - typecheck
    - owner-leakage
    - fixture-shape
    - plugin-schema-validate
    - hook-import-set-check
    - package-manager-guard
    - test
    # Optional + artifacts — conditionally absent, judged by marker (mechanism 2).
    - job: coverage
      optional: true
      artifacts: true
    - job: schema-drift-check
      optional: true
      artifacts: true
  script:
    # One folded block on purpose: a single shell scope, one exit decision, and
    # no value ever passes through a `$(...)` capture that a stray echo could
    # corrupt (.claude/rules/bash-harness-pitfalls.md #2/#3).
    - >
      set -u;
      failed=0;
      echo "[gate] pipeline=$CI_PIPELINE_ID source=$CI_PIPELINE_SOURCE ref=${CI_COMMIT_BRANCH:-merge-request}";
      if [ -d .ci-markers ]; then ls -la .ci-markers; else echo "[gate] no .ci-markers/ directory present"; fi;
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] || [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        if [ -f .ci-markers/coverage.ok ]; then
          echo "[gate] coverage:     VERIFIED";
        else
          echo "[gate] coverage:     MISSING — required on MR and $CI_DEFAULT_BRANCH pipelines, but no marker was produced";
          failed=1;
        fi;
      else
        echo "[gate] coverage:     NOT REQUIRED here — this branch pipeline did NOT measure coverage (MR + $CI_DEFAULT_BRANCH only)";
      fi;
      if [ -f .ci-markers/schema-drift.ok ]; then
        echo "[gate] schema-drift: VERIFIED";
      elif [ "$SCHEMA_DRIFT_OPTIONAL" = "true" ]; then
        echo "[gate] schema-drift: NOT VERIFIED (AMBER) — SCHEMA_DRIFT_TOKEN unset and SCHEMA_DRIFT_OPTIONAL=true. This pipeline is green BY DECLARATION, not because the schema was checked; the schema-drift-check job exited 3. See docs/ci-setup.md to provision the token and flip the flag.";
      else
        echo "[gate] schema-drift: NOT VERIFIED and not declared optional";
        failed=1;
      fi;
      if [ "$failed" -ne 0 ]; then echo "[gate] RESULT: FAIL"; exit 1; fi;
      echo "[gate] RESULT: PASS — every hard-needed gate succeeded"
  rules: *gate-rules

# ---------------------------------------------------------------------------
# Stage: scheduled
#
# vault-watcher — daily watcher for vault-integration warn→strict flip (#306).
#
# Runs via GitLab CI Scheduled Pipeline. Configure in GitLab UI:
#   CI/CD → Schedules → New schedule:
#     Description: vault-watcher
#     Cron: 0 7 * * *          (07:00 UTC = 09:00 Europe/Vienna)
#     Target branch: main
#     Variables: SCHEDULE_NAME = vault-watcher
#
# Required CI variable (masked + protected):
#   WATCHER_GITLAB_TOKEN — project token with api + write_comments scope
#   on infrastructure/session-orchestrator. Set in:
#   GitLab → Settings → CI/CD → Variables → Add variable.
#
# Manual trigger for testing (GitLab UI):
#   CI/CD → Pipelines → Run pipeline → add variable SCHEDULE_NAME=vault-watcher
#
# The schedule itself is controlled by the GitLab UI — no code change needed
# to enable/disable. The job is dormant in all non-scheduled pipelines
# thanks to the rule below.
# ---------------------------------------------------------------------------

vault-watcher:
  stage: scheduled
  # Pinned to ${NODE_VERSION} patch (SEC-020: no floating tag). A `@sha256:`
  # image digest pin is preferred for full immutability.
  image: node:${NODE_VERSION}-alpine
  before_script:
    # coreutils provides GNU sha256sum — busybox's lacks `--ignore-missing`,
    # which the glab checksum verification below relies on.
    - apk add --no-cache git curl bash coreutils
    # Install glab CLI — pinned $GLAB_VERSION + checksum-verified download
    # (SEC-020: no floating `latest`, integrity-verified artifact, and NOT a
    # `curl | tar` pipe — the tarball is fetched to disk and its sha256 checked
    # against the release's checksums.txt BEFORE extraction). To bump: change
    # GLAB_VERSION below; checksums.txt is pulled from the matching release.
    - >
      cd /tmp &&
      GLAB_TARBALL="glab_${GLAB_VERSION#v}_linux_amd64.tar.gz" &&
      curl -sSfL -o "$GLAB_TARBALL"
      "https://gitlab.com/gitlab-org/cli/-/releases/${GLAB_VERSION}/downloads/${GLAB_TARBALL}" &&
      curl -sSfL -o checksums.txt
      "https://gitlab.com/gitlab-org/cli/-/releases/${GLAB_VERSION}/downloads/checksums.txt" &&
      sha256sum --ignore-missing -c checksums.txt &&
      tar xzf "$GLAB_TARBALL" -C /tmp &&
      mv /tmp/bin/glab /usr/local/bin/glab &&
      chmod +x /usr/local/bin/glab
    # Configure glab to use this GitLab instance + token
    - glab config set -g token "$WATCHER_GITLAB_TOKEN"
    - glab config set -g gitlab_host "$CI_SERVER_HOST"
    - npm ci
  script:
    - node scripts/vault-integration-watcher.mjs --verbose
  variables:
    GITLAB_TOKEN: $WATCHER_GITLAB_TOKEN
    # glab CLI release to install (checksum-verified in before_script). Bump in
    # lockstep with any change to the download/verify block above.
    GLAB_VERSION: "v1.105.0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "vault-watcher"'

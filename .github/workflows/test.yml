name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Security gates — run on Linux only, fail fast (#350, #351)
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit (production deps, high+)
        # --audit-level=high matches `audit-level=high` in .npmrc.
        # --omit=dev: only production deps gate the pipeline. Dev deps may
        # carry advisories without affecting shipped runtime.
        run: npm audit --audit-level=high --omit=dev

  test:
    needs: security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 15 min held until the suite grew past ~21k tests: on 2026-10-21 macOS
    # vitest alone took 13:22 and the Linux job hit 15 min inside coverage.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Verify environment (Unix)
        shell: bash
        run: |
          bash --version | head -1
          git --version
          jq --version

      - name: Configure git identity (all platforms)
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"

      - name: Install Node dependencies
        run: npm ci

      - name: Owner-privacy leak gate (#471)
        shell: bash
        run: node scripts/lib/validate/check-owner-leakage.mjs "$GITHUB_WORKSPACE"

      - name: Plugin manifest schema validation (#475)
        shell: bash
        run: node scripts/validate-plugin-manifests.mjs "$GITHUB_WORKSPACE"

      - name: Lint
        run: npm run lint

      - name: Typecheck (.mjs files — Wave 3+)
        shell: bash
        run: |
          if ls hooks/*.mjs scripts/lib/*.mjs 2>/dev/null | grep -q .; then
            npm run typecheck
          else
            echo "No .mjs files yet (Wave 3 adds them) — skipping typecheck"
          fi

      # On Linux the tinypool exit-hang (#268, upstream vitest issue #3077)
      # still occurs occasionally with vitest 4 + pool=forks: the runner
      # hangs at worker teardown AFTER all tests have passed. Without a
      # wrapper the job hits its workflow timeout. Mirrors the
      # GitLab CI remediation in .gitlab-ci.yml. macOS does not exhibit the
      # hang — keep the plain `npm test` path for it.
      - name: Vitest (Linux — wrapped)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -f /tmp/vitest-result.json   # stale-file guard (defensive; runners are ephemeral)
          timeout --preserve-status 1200s npm test -- --reporter=verbose --reporter=json --outputFile=/tmp/vitest-result.json --no-color 2>&1 | tee /tmp/vitest.raw.log || true
          sed -r 's/\x1b\[[0-9;]*[mK]//g' /tmp/vitest.raw.log > /tmp/vitest.log || cp /tmp/vitest.raw.log /tmp/vitest.log
          tail -80 /tmp/vitest.log
          # Fail-closed JSON verifier is the SINGLE authority on pass/fail. It replaces the
          # brittle grep-the-stdout heuristic that reported a killed-mid-run suite as GREEN
          # (the 8-pipeline silent regression — see CLAUDE.md Critical Gotchas and the
          # rationale block in scripts/ci/assert-vitest-green.mjs). GitHub runs the full
          # UNSHARDED suite (~10,000+ tests), so --min-tests=6000 is a safe floor below the
          # real count that still catches a truncated/partial run. The `|| true` above lets
          # the pipeline REACH this line; the exit code of THIS line is the job result.
          node scripts/ci/assert-vitest-green.mjs /tmp/vitest-result.json --min-tests=6000 --log=/tmp/vitest.log

      - name: Vitest (macOS — plain)
        if: runner.os == 'macOS'
        shell: bash
        run: npm test

      - name: Coverage (Linux only, gated at 70% lines/funcs/stmts, 60% branches)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -f /tmp/cov-result.json   # stale-file guard (defensive; runners are ephemeral)
          timeout --preserve-status 1200s npm run test:coverage -- --reporter=verbose --reporter=json --outputFile=/tmp/cov-result.json --no-color 2>&1 | tee /tmp/cov.raw.log || true
          sed -r 's/\x1b\[[0-9;]*[mK]//g' /tmp/cov.raw.log > /tmp/cov.log || cp /tmp/cov.raw.log /tmp/cov.log
          tail -100 /tmp/cov.log
          # Fail-closed JSON verifier is the SINGLE authority on test pass/fail (replaces the
          # brittle grep heuristic). The cobertura-artifact and threshold-breach grep below
          # are SEPARATE gates from test-green: the JSON `success` field reflects pass/fail,
          # NOT the coverage threshold. --min-tests=6000 floor matches the full unsharded run.
          node scripts/ci/assert-vitest-green.mjs /tmp/cov-result.json --min-tests=6000
          test -f coverage/cobertura-coverage.xml && echo "[ci] coverage artifact present"
          ! grep -q "Coverage for .* .* below" /tmp/cov.log

  # #1612: native Windows evidence, split in two so a red dev suite cannot
  # hide a red product check.
  #  - test-windows-smoke: lint, typecheck and scripts/ci/windows-smoke.mjs
  #    (gate processes, hooks through Git Bash, first SessionStart). This is
  #    the product contract for "Claude Code on Windows". Non-blocking at
  #    first; revisit: nach 10 gruenen main-Laeufen in gate aufnehmen.
  #  - test-windows-suite: the full vitest suite, informational only. Native
  #    measurement 2026-10-14 @ da365a5e: 19,651 passed / 881 failed, almost
  #    all POSIX assumptions inside tests (sh, '/' separators, symlinks);
  #    backlog #1613.
  test-windows-smoke:
    runs-on: windows-latest
    needs: security
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        # PowerShell keeps runner.temp paths native; the smoke itself runs the
        # hooks.json commands through Git Bash, the way Claude Code does.
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Native Windows smoke
        run: node scripts/ci/windows-smoke.mjs

  test-windows-suite:
    runs-on: windows-latest
    needs: security
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"

      # common.requireJq and validate-plugin tests require jq on PATH.
      - name: Install jq
        run: choco install jq -y --no-progress

      - name: Verify jq
        run: jq --version

      - name: Install Node dependencies
        run: npm ci

      # Informational: a red suite must not turn this job's check run red.
      # Job-level continue-on-error keeps only the RUN green; the check run
      # still concludes "failure", and release.mjs (ci-green-on-head-github)
      # reads every failed check run as red. Revisit with #1613.
      - name: Vitest (Windows — fail-closed JSON verifier)
        continue-on-error: true
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'vitest-result.json'
          if (Test-Path -LiteralPath $result) { Remove-Item -LiteralPath $result -Force }
          # Like Linux, the JSON verifier is the authority even when npm exits
          # nonzero. Missing, partial or failed results cannot report green.
          $PSNativeCommandUseErrorActionPreference = $false
          npm test -- --reporter=default --reporter=json "--outputFile=$result"
          node scripts/ci/assert-vitest-green.mjs "$result" --min-tests=6000
          exit $LASTEXITCODE

  # Fan-in — mirror of the `pipeline-gate` job in .gitlab-ci.yml (#933 Loch 3).
  #
  # GitHub's counterpart to GitLab's "needs: on an absent job" trap is SKIPPING:
  # a job with `needs: [a, b]` and no `if:` is silently SKIPPED when a dependency
  # fails or is skipped, and a skipped check is not a failed check — so a run can
  # finish with no job reporting failure. `if: always()` forces this job to run
  # in every outcome, and the assertions below turn anything that is not an
  # explicit `success` into a red check.
  #
  # There is deliberately NO schema-drift counterpart: that gate needs a token
  # for a private GitLab project (see the header of .gitlab-ci.yml), so it
  # cannot exist here. Coverage needs none either — it runs as a step inside the
  # Linux `test` job above, not as a separate conditional job.
  gate:
    needs: [security, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        shell: bash
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "[gate] security=$SECURITY_RESULT test=$TEST_RESULT"
          failed=0
          for pair in "security:$SECURITY_RESULT" "test:$TEST_RESULT"; do
            name=${pair%%:*}
            result=${pair#*:}
            if [ "$result" = "success" ]; then
              echo "[gate] $name: OK"
            else
              echo "[gate] $name: NOT SUCCESSFUL (result=$result)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then echo "[gate] RESULT: FAIL"; exit 1; fi
          echo "[gate] RESULT: PASS"

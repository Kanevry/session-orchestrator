# GitHub carries a curated mirror of the private GitLab repository (#1594):
# no tests/, no vitest or eslint config. The full suite, lint and coverage run
# on GitLab; here run the security gates and a smoke of what a user's install
# needs (scripts/ci/plugin-smoke.mjs, `npm run test:mirror`).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Security gates — run on Linux only, fail fast (#350, #351)
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit (production deps, high+)
        # --audit-level=high matches `audit-level=high` in .npmrc.
        # --omit=dev: only production deps gate the pipeline. Dev deps may
        # carry advisories without affecting shipped runtime.
        run: npm audit --audit-level=high --omit=dev

  # Mirror smoke (#1594): this tree has no tests/, vitest or eslint config, so
  # the job checks what a user's install needs. Job id and matrix stay: branch
  # protection requires `test (ubuntu-latest)` and `test (macos-latest)`.
  test:
    needs: security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Configure git identity
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"

      - name: Install Node dependencies
        run: npm ci

      - name: Owner-privacy leak gate (#471)
        shell: bash
        run: node scripts/lib/validate/check-owner-leakage.mjs "$GITHUB_WORKSPACE"

      - name: Mirror smoke (manifests, syntax, dependencies, SessionStart)
        run: npm run test:mirror

  # #1612: native Windows evidence for "Claude Code on Windows": the mirror
  # smoke plus scripts/ci/windows-smoke.mjs (gate processes, hooks through Git
  # Bash, first SessionStart). Informational; revisit: nach 10 gruenen
  # main-Laeufen in gate aufnehmen. The full Windows suite needs tests/ and
  # no longer runs on GitHub (#1594, backlog #1613).
  test-windows-smoke:
    runs-on: windows-latest
    needs: security
    timeout-minutes: 20
    # #1712: step-level tolerance keeps this informational check run green;
    # job-level continue-on-error only keeps the workflow green. Warn below.
    defaults:
      run:
        # PowerShell keeps runner.temp paths native; the smoke itself runs the
        # hooks.json commands through Git Bash, the way Claude Code does.
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.com"

      - name: Install Node dependencies
        run: npm ci

      - name: Mirror smoke
        id: mirror
        continue-on-error: true
        run: npm run test:mirror

      - name: Native Windows smoke
        id: smoke
        continue-on-error: true
        run: node scripts/ci/windows-smoke.mjs

      - name: Report Windows smoke failures
        if: always() && (steps.mirror.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: 'echo "::warning title=Windows smoke::Informational Windows checks failed: mirror=${{ steps.mirror.outcome }}, smoke=${{ steps.smoke.outcome }}. See step logs (#1712)."'

  # Fan-in — mirror of the `pipeline-gate` job in .gitlab-ci.yml (#933 Loch 3).
  #
  # GitHub's counterpart to GitLab's "needs: on an absent job" trap is SKIPPING:
  # a job with `needs: [a, b]` and no `if:` is silently SKIPPED when a dependency
  # fails or is skipped, and a skipped check is not a failed check — so a run can
  # finish with no job reporting failure. `if: always()` forces this job to run
  # in every outcome, and the assertions below turn anything that is not an
  # explicit `success` into a red check.
  #
  # There is deliberately NO schema-drift counterpart: that gate needs a token
  # for a private GitLab project (see the header of .gitlab-ci.yml), so it
  # cannot exist here. Coverage needs none either — it runs on GitLab only (#1594).
  gate:
    needs: [security, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        shell: bash
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "[gate] security=$SECURITY_RESULT test=$TEST_RESULT"
          failed=0
          for pair in "security:$SECURITY_RESULT" "test:$TEST_RESULT"; do
            name=${pair%%:*}
            result=${pair#*:}
            if [ "$result" = "success" ]; then
              echo "[gate] $name: OK"
            else
              echo "[gate] $name: NOT SUCCESSFUL (result=$result)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then echo "[gate] RESULT: FAIL"; exit 1; fi
          echo "[gate] RESULT: PASS"
